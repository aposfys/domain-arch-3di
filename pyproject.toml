[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "domarch"
version = "0.1.0"
description = "Sequence versus 3Di structural characters for domain architecture evolution"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Apostolos Fysekidis" }]
keywords = ["phylogenetics", "foldseek", "3di", "alphafold", "interpro", "domain-architecture"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Biopython is a base dependency: neighbour joining and the AlphaFold PDB parsing are
# both core, not optional analysis. Foldseek stays external -- it is a binary, not a wheel.
dependencies = [
    "numpy>=1.24",
    "requests>=2.31",
    "biopython>=1.83",
]

[project.optional-dependencies]
bio = ["biopython>=1.80"]
trees = ["dendropy>=4.6", "ete3>=3.1"]
figures = ["matplotlib>=3.7"]
dev = ["pytest>=7.0", "numpy>=1.24", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
domarch = "domarch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 95
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["^tests/"]
